<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: oklch(0.18 0.025 250);
        background: white;
      }
      main {
        width: min(420px, calc(100% - 32px));
        border: 1px solid oklch(0.9 0.01 250);
        border-radius: 14px;
        padding: 22px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }
      p {
        margin: 0;
        color: oklch(0.46 0.02 250);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Orbit is offline</h1>
      <p>The app shell is available. New text/link captures will sync after your connection returns.</p>
    </main>
  </body>
</html>
