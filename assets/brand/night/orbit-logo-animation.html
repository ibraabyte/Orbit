<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Logo Reveal</title>
<style>
  html, body { margin: 0; height: 100%; background: #0A0A0B; }
  body { display: grid; place-items: center; }
  #logo { width: min(60vmin, 420px); height: auto; overflow: visible; }

  /* Mask wipe: a thick ring stroke draws clockwise from the thin tail to the round head. */
  #logo .wipe {
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: draw 1.3s cubic-bezier(.55, 0, .25, 1) forwards;
  }
  /* Settle: tiny overshoot the moment the head lands. */
  #logo .mark {
    transform-box: view-box; transform-origin: 50% 50%;
    animation: settle .3s ease-out 1.3s both;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes settle { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.04); } }

  @media (prefers-reduced-motion: reduce) {
    #logo .wipe { animation: none; stroke-dashoffset: 0; }
    #logo .mark { animation: none; }
  }
</style>
</head>
<body>
<svg id="logo" viewBox="0 0 256 256" role="img" aria-label="Orbit">
  <defs>
    <mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <!-- Ring centred on the mark (128,128), r=84, width 76 covers the whole band incl. the head cap.
           Starts at -25° (just behind the tail) and runs clockwise. -->
      <path class="wipe" d="M204.13 92.5A84 84 0 1 1 51.87 163.5A84 84 0 1 1 204.13 92.5"
            fill="none" stroke="#fff" stroke-width="76" pathLength="1"/>
    </mask>
  </defs>
  <g class="mark">
    <path mask="url(#reveal)" fill="#D6BE8C" d="M235.90 113.55C237.96 130.34 236.02 147.61 230.28 163.53C224.54 179.44 215.02 193.97 202.71 205.58C190.41 217.19 175.35 225.85 159.13 230.66C142.91 235.46 125.55 236.40 108.91 233.36C92.27 230.33 76.37 223.33 62.88 213.11C49.40 202.89 38.37 189.47 30.96 174.26C23.54 159.06 19.75 142.10 20.00 125.18C20.25 108.27 24.52 91.43 32.38 76.45C40.23 61.46 51.65 48.37 65.42 38.54C79.20 28.72 95.30 22.19 112.02 19.64C128.74 17.09 146.06 18.53 162.13 23.80C178.21 29.07 193.01 38.18 204.97 50.14A26.09 26.09 0 0 1 168.08 87.03C162.39 80.32 154.98 74.84 146.55 71.31C138.11 67.78 128.68 66.21 119.23 66.92C109.78 67.62 100.32 70.61 91.93 75.71C83.54 80.80 76.23 88.00 70.89 96.63C65.54 105.27 62.18 115.33 61.30 125.78C60.42 136.24 62.04 147.08 66.13 157.11C70.21 167.14 76.77 176.35 85.21 183.66C93.66 190.97 103.98 196.37 115.15 199.15C126.32 201.92 138.32 202.06 149.86 199.39C161.41 196.73 172.48 191.26 181.83 183.44C191.17 175.62 198.77 165.45 203.70 153.94C208.62 142.42 210.85 129.57 210.01 116.73A13.04 13.04 0 0 1 235.90 113.55Z"/>
  </g>
</svg>
<script>
  // Freeze harness: ?t=1.1 pins that moment (keeps each element's own delay).
  const t = new URLSearchParams(location.search).get("t");
  if (t !== null) {
    const T = parseFloat(t);
    document.querySelectorAll("#logo .wipe, #logo .mark").forEach(el => {
      const base = parseFloat(getComputedStyle(el).animationDelay) || 0;
      el.style.animationDelay = (base - T) + "s";
      el.style.animationPlayState = "paused";
    });
  }
  window.__ready = true;
</script>
</body>
</html>
