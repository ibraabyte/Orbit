# Orbit API + Postgres, for Coolify (Docker Compose build pack, base directory /backend). Step by step: DEPLOY.md.
# Coolify's proxy handles the domain and HTTPS: set the api service's domain to port 8000 in the UI.
# The SERVICE_* values are generated by Coolify on first deploy and kept after that.
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      ORBIT_DATABASE_URL: postgresql+psycopg://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@db:5432/orbit
      ORBIT_JWT_SECRET: ${SERVICE_BASE64_64_JWT}
      ORBIT_ALLOW_SIGNUPS: ${ORBIT_ALLOW_SIGNUPS:-false}
      # Google sign-in, WHOOP and the AI summary stay off until these are set in Coolify's Environment Variables.
      ORBIT_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ORBIT_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ORBIT_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      ORBIT_WHOOP_CLIENT_ID: ${WHOOP_CLIENT_ID:-}
      ORBIT_WHOOP_CLIENT_SECRET: ${WHOOP_CLIENT_SECRET:-}
      ORBIT_WHOOP_REDIRECT_URI: ${WHOOP_REDIRECT_URI:-}
      ORBIT_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ORBIT_CHATGPT_MODEL: ${CHATGPT_MODEL:-}
    # Seerr shares this server's public IP, and calls to that IP from here are refused. This sends them to Coolify's
    # proxy on this app's network instead, which an extra proxy rule lets through (orbit-seerr.yaml on the server).
    # ponytail: fixed proxy IP; if Seerr stops connecting after Coolify recreates the network, check this address.
    extra_hosts:
      - "requests.ibrabyte.app:10.0.3.2"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: orbit
    volumes:
      - orbit-postgres:/var/lib/postgresql/data
      # Nightly pg_dump files land here (a Coolify Scheduled Task runs the dump, see DEPLOY.md).
      - orbit-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d orbit"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  orbit-postgres:
  orbit-backups:
